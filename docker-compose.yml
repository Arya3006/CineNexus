version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend/client
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/client/.env
    restart: unless-stopped
    depends_on:
      - backend